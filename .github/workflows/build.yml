#
# Validates the portable wrapper on Windows, including recovery of a disposable user's PATH.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Build

on:  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  schedule:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
    - cron: "0 15 1 * *"
  push:
    branches-ignore:  # build all branches except:
    - "dependabot/**"  # prevent GHA triggered twice (once for commit to the branch and once for opening/syncing the PR)
    tags-ignore:  # don't build tags
    - "**"
    paths-ignore:
    - ".act*"
    - "**/*.adoc"
    - "**/*.md"
    - ".editorconfig"
    - ".git*"
    - ".github/*.yml"
    - ".github/ISSUE_TEMPLATE/*"
    - ".github/workflows/stale.yml"
  pull_request:
    paths-ignore:
    - ".act*"
    - "**/*.adoc"
    - "**/*.md"
    - ".editorconfig"
    - ".git*"
    - ".github/*.yml"
    - ".github/ISSUE_TEMPLATE/*"
    - ".github/workflows/stale.yml"
  workflow_dispatch:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch


defaults:
  run:
    shell: cmd


jobs:
  ###########################################################
  build:
  ###########################################################
    runs-on: windows-latest

    steps:
    - name: Git Checkout
      uses: actions/checkout@v7  # https://github.com/actions/checkout


    - name: "Check: no text after label names in batch files"
      # cmd can execute the rest of a label line as a command (see the NOTE in scoop-portable.cmd).
      # uses PowerShell because findstr character classes do not follow ASCII order and matched
      # "::" comment lines while missing real label lines
      shell: pwsh
      run: |
        # a label name needs a word character after the colon, so "::" comment lines do not match;
        # trailing whitespace alone is harmless and allowed
        $hits = Select-String -Path scoop-portable.cmd, tests\*.cmd -Pattern '^:[A-Za-z0-9_]+[ \t]+\S'
        $hits | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::text after label name: $($_.Line)" }
        if ($hits) { exit 1 }


    - name: "Test: user PATH snapshot helpers"
      run: powershell -noprofile -ex unrestricted -file tests\test-user-path.ps1


    - name: Create Windows user 'noadmin'
      run: |
        net user noadmin p@ssw0rd /add


    - name: Install sudo
      run: |
       curl -sSfL https://github.com/chrisant996/sudo-windows/releases/download/v1.0.3/sudo-x64-v1.0.3.c01d18-exe.zip -o sudo.zip
       unzip sudo.zip -d C:\Windows\System32

    # https://github.com/poweradminllc/PAExec
    #- name: Install paexec
    #  run: curl -sSfL https://www.poweradmin.com/paexec/paexec.exe -o C:\Windows\System32\paexec.exe


    - name: "Install: scoop-portable"
      # installs scoop-portable as user "nonadmin"
      run: |
        cd tests
        copy ..\scoop-portable.cmd .

        :: paexec could be used as alternative to chris' sudo:
        ::   paexec -u noadmin -p p@ssw0rd -w %CD% cmd /c scoop-portable.cmd ^>log.txt
        ::   cat log.txt

        echo p@ssw0rd| sudo -u noadmin --stdin cmd /c scoop-portable.cmd


    - name: "Test: scoop-portable"
      run: echo p@ssw0rd| sudo -u noadmin --stdin cmd /c "%CD%\tests\test-scoop.cmd"


    - name: "Test: user PATH recovery after update"
      # This fixture changes HKCU\Environment\Path, so keep it outside the general
      # suite that also runs as the runner account or in a developer's profile.
      # sudo creates a fresh environment from noadmin's profile, which loses GITHUB_ACTIONS.
      # Forward the runner's marker explicitly so the fixture can keep its CI-only safety check.
      run: >-
        echo p@ssw0rd| sudo -u noadmin --stdin cmd /d /s /c
        "set GITHUB_ACTIONS=%GITHUB_ACTIONS%&& powershell -noprofile -ex unrestricted -file "%CD%\tests\test-user-path-update.ps1""


    - name: "Test: scoop-portable - different user and path"
      # moves scoop-portable installation path and runs scoop-portable under different user
      run: |
        :: move scoop portable folder to another location
        ren tests my_new_scoop_dir

        :: load environment as different user (i.e. "runner")
        my_new_scoop_dir\test-scoop.cmd


    - name: "Test: scoop-portable - scoop update"
      run: my_new_scoop_dir\test-update.cmd


    - name: "Test: scoop-portable - failed download aborts installation"
      # redirects get.scoop.sh to localhost so that downloading the installer fails.
      # runs last because it changes the hosts file of the runner
      run: |
        (echo.& echo 127.0.0.1 get.scoop.sh& echo ::1 get.scoop.sh)>>%SystemRoot%\System32\drivers\etc\hosts
        ipconfig /flushdns
        :: fail on setup errors, otherwise calling a missing wrapper would also count as the expected failure
        mkdir failing_install || exit 1
        copy scoop-portable.cmd failing_install\ || exit 1
        call failing_install\scoop-portable.cmd && (
          echo ERROR: Expected the installation to fail!
          exit 1
        )
        exit 0
